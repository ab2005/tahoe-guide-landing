<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 860 430" width="860" height="430" role="img" aria-label="A catalogue of local offers arranged on shelves: cruises, kayaks, bikes, concerts, tours">
  <!-- Brand palette: page #f4f4ef, tint #eef2e8, green #2f6b2f, ink #12140f -->
  <rect width="860" height="430" fill="#eef2e8"/>

  <!-- distant ridge line, a nod to the lake -->
  <path d="M0 96 L120 58 L210 92 L330 40 L440 88 L560 52 L680 90 L780 62 L860 84 L860 0 L0 0 Z" fill="#e2e8d9"/>
  <path d="M0 110 L150 74 L260 104 L400 58 L540 100 L660 70 L860 102 L860 430 L0 430 Z" fill="#eef2e8"/>

  <!-- ══ Shelf 1 ══ -->
  <!-- tile: cruise -->
  <g transform="translate(60,80)">
    <rect width="150" height="120" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M35 66 L115 66 L103 84 L47 84 Z"/>
      <path d="M55 66 L55 46 L85 46 L85 66"/>
      <path d="M70 46 L70 34 L88 40 L70 46"/>
      <path d="M30 94 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 20 0 q10 8 10 0" stroke-width="3.4"/>
    </g>
    <rect x="35" y="102" width="80" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- tile: kayak -->
  <g transform="translate(230,64)">
    <rect width="150" height="136" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 78 Q75 58 120 78 Q75 98 30 78 Z"/>
      <path d="M52 100 L98 52"/>
      <path d="M44 106 L60 96 M90 58 L106 48"/>
    </g>
    <rect x="35" y="114" width="60" height="6" rx="3" fill="#d5e0c9"/>
    <!-- host's pick dot -->
    <circle cx="126" cy="24" r="7" fill="#8fd07a"/>
  </g>
  <!-- tile: gondola / tram -->
  <g transform="translate(400,86)">
    <rect width="150" height="114" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 34 L130 22"/>
      <path d="M76 28 L76 44"/>
      <rect x="54" y="44" width="44" height="38" rx="8"/>
      <path d="M54 60 L98 60"/>
    </g>
    <rect x="35" y="94" width="72" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- tile: concert -->
  <g transform="translate(570,70)">
    <rect width="150" height="130" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M62 92 L62 40 L104 32 L104 84"/>
      <circle cx="52" cy="92" r="11"/>
      <circle cx="94" cy="84" r="11"/>
    </g>
    <rect x="35" y="110" width="56" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- shelf board 1 -->
  <rect x="36" y="204" width="788" height="10" rx="5" fill="#d5e0c9"/>

  <!-- ══ Shelf 2 ══ -->
  <!-- tile: tickets -->
  <g transform="translate(96,248)">
    <rect width="150" height="120" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M36 52 L114 52 L114 66 Q106 72 114 78 L114 92 L36 92 L36 78 Q44 72 36 66 Z"/>
      <path d="M75 56 L75 88" stroke-dasharray="2 7" stroke-width="3.4"/>
    </g>
    <rect x="35" y="102" width="68" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- tile: bike rental -->
  <g transform="translate(266,232)">
    <rect width="150" height="136" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="48" cy="88" r="17"/>
      <circle cx="104" cy="88" r="17"/>
      <path d="M48 88 L64 56 L92 56 L104 88 M64 56 L76 88 L48 88"/>
      <path d="M88 46 L98 46"/>
    </g>
    <rect x="35" y="114" width="76" height="6" rx="3" fill="#d5e0c9"/>
    <circle cx="126" cy="24" r="7" fill="#8fd07a"/>
  </g>
  <!-- tile: hiking tour -->
  <g transform="translate(436,254)">
    <rect width="150" height="114" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M30 88 L62 40 L82 66 L96 48 L122 88 Z"/>
      <circle cx="104" cy="34" r="9"/>
    </g>
    <rect x="35" y="96" width="60" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- tile: dinner / tasting -->
  <g transform="translate(606,240)">
    <rect width="150" height="128" rx="12" fill="#ffffff" stroke="#d5e0c9"/>
    <g stroke="#2f6b2f" stroke-width="4" fill="none" stroke-linecap="round" stroke-linejoin="round">
      <path d="M52 36 L52 92 M44 36 L44 54 Q44 62 52 62 Q60 62 60 54 L60 36"/>
      <path d="M92 92 L92 36 Q106 44 106 62 L92 66"/>
    </g>
    <rect x="35" y="106" width="64" height="6" rx="3" fill="#d5e0c9"/>
  </g>
  <!-- shelf board 2 -->
  <rect x="36" y="372" width="788" height="10" rx="5" fill="#d5e0c9"/>

  <!-- count chip, mono-style -->
  <g transform="translate(612,30)">
    <rect width="128" height="34" rx="17" fill="#12140f"/>
    <text x="64" y="22" text-anchor="middle" font-family="'IBM Plex Mono',ui-monospace,monospace" font-size="14" fill="#c3c8b8">~200 offers</text>
  </g>
</svg>
